buildscript {
    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        eventuateMavenRepoUrl.split(',').each { repoUrl -> maven { url repoUrl } }
    }
    dependencies {
        classpath "io.eventuate.plugins.gradle:eventuate-plugins-gradle-publish:$eventuatePluginsGradleVersion"
    }
}

// Apply the Eventuate publish plugin if possible; don't fail the build when running locally
try {
    apply plugin: "io.eventuate.plugins.gradle.publish.EventuatePublish"
} catch (e) {
    // Log a warning and continue. The plugin can fail when git/CI metadata (branch) is not available.
    logger.warn("Skipping EventuatePublish plugin because it failed to apply: ${e.message}")
}

allprojects {
    group = "io.eventuate.examples.spring-authorization-server"
}

subprojects {

    apply plugin: "java-library"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
        eventuateMavenRepoUrl.split(',').each { repoUrl -> maven { url repoUrl } }
    }

    dependencies {
        implementation(platform("org.springframework.boot:spring-boot-dependencies:$springBootVersion"))
    }

    test {
        useJUnitPlatform()
    }

    if (!tasks.findByName('wrapper')) {
        tasks.register('wrapper') {
            dependsOn rootProject.tasks.named('wrapper')
            group = 'Build Setup'
            description = 'Delegates to the root project wrapper task.'
        }
    }

}

if (project == rootProject) {
    def existingWrapper = tasks.findByName('wrapper')
    if (existingWrapper) {
        tasks.withType(Wrapper).configureEach {
            gradleVersion = '8.13'
            distributionType = Wrapper.DistributionType.ALL
        }
    } else {
        tasks.register('wrapper', Wrapper) {
            gradleVersion = '8.13'
            distributionType = Wrapper.DistributionType.ALL
        }
    }
}

gradle.projectsEvaluated {
    allprojects {
        if (!tasks.findByName('prepareKotlinBuildScriptModel')) {
            tasks.register('prepareKotlinBuildScriptModel') {
                group = 'Help'
                description = 'No-op task for IDE compatibility when Kotlin plugin is not applied.'
            }
        }
    }
}
