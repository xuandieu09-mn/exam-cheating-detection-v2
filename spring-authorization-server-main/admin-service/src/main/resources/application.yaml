server:
  port: 8200

spring:
  application:
    name: admin-service

  datasource:
    url: ${OAUTH_DB_URL:jdbc:postgresql://localhost:55432/exam_identity}
    username: ${OAUTH_DB_USERNAME:postgres}
    password: ${OAUTH_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

admin:
  api-user:
    username: ${ADMIN_API_USERNAME:admin}
    password: ${ADMIN_API_PASSWORD:admin-secret}
  seed-client:
    client-id: ${BFF_CLIENT_ID:exam-bff-client}
    client-secret: ${BFF_CLIENT_SECRET:exam-bff-secret}
    redirect-uris:
      - ${BFF_REDIRECT_URI:http://localhost:8080/api/auth/callback/exam-oidc}
    post-logout-redirect-uris:
      - ${BFF_LOGOUT_REDIRECT:http://localhost:8080}
    scopes:
      - openid
      - profile

