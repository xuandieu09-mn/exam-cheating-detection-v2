name: exam-cheating-detection-v2

services:
  postgres:
    image: postgres:16.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  otel-collector:
    image: otel/opentelemetry-collector:0.88.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4318:4318"

  authorization-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.spring
      args:
        MODULE: authorization-server
        PORT: 9000
    environment:
      OAUTH_DB_URL: jdbc:postgresql://postgres:5432/exam_identity
      OAUTH_DB_USERNAME: postgres
      OAUTH_DB_PASSWORD: postgres
      AS_ISSUER_URI: http://localhost:9000
      AS_ALLOWED_ORIGINS: http://localhost:5173
      BFF_CLIENT_ID: exam-bff-client
      BFF_CLIENT_SECRET: exam-bff-secret
      BFF_REDIRECT_URI: http://localhost:8080/api/auth/callback/exam-oidc
      SPA_CLIENT_ID: react-test-client
      SPA_REDIRECT_URI: http://localhost:5173/auth/callback
    ports:
      - "9000:9000"
    depends_on:
      - postgres

  admin-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.spring
      args:
        MODULE: admin-service
        PORT: 8200
    environment:
      OAUTH_DB_URL: jdbc:postgresql://postgres:5432/exam_identity
      OAUTH_DB_USERNAME: postgres
      OAUTH_DB_PASSWORD: postgres
      ADMIN_API_USERNAME: admin
      ADMIN_API_PASSWORD: admin-secret
      BFF_CLIENT_ID: exam-bff-client
      BFF_CLIENT_SECRET: exam-bff-secret
      BFF_REDIRECT_URI: http://localhost:8080/api/auth/callback/exam-oidc
      BFF_LOGOUT_REDIRECT: http://localhost:8080
    ports:
      - "8200:8200"
    depends_on:
      - postgres

  user-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.spring
      args:
        MODULE: user-service
        PORT: 8100
    environment:
      UMS_DB_URL: jdbc:postgresql://postgres:5432/exam_identity
      UMS_DB_USERNAME: postgres
      UMS_DB_PASSWORD: postgres
      AS_ISSUER_URI: http://localhost:9000
      AS_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
    ports:
      - "8100:8100"
    depends_on:
      - postgres
      - authorization-server

  bff-gateway:
    build:
      context: ./bff-gateway
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:8080
      BFF_CLIENT_ID: exam-bff-client
      BFF_CLIENT_SECRET: exam-bff-secret
      AUTH_SERVER_ISSUER: http://localhost:9000
      AUTH_SERVER_WELL_KNOWN_URL: http://authorization-server:9000/.well-known/openid-configuration
      AUTH_SERVER_TOKEN_URL: http://authorization-server:9000/oauth2/token
      UPSTREAM_API_BASE_URL: http://user-service:8100
      BFF_SCOPES: openid profile exam.read exam.write offline_access
      BFF_SESSION_COOKIE: SESSION_ID
    ports:
      - "8080:8080"
    depends_on:
      - authorization-server
      - user-service

  react-client:
    build:
      context: ./react-client
      dockerfile: Dockerfile
      args:
        VITE_OIDC_ISSUER: http://localhost:9000
        VITE_OIDC_CLIENT_ID: react-test-client
        VITE_OIDC_REDIRECT_URI: http://localhost:5173/auth/callback
        VITE_OIDC_SCOPE: "openid profile exam.read"
    ports:
      - "5173:80"
    depends_on:
      - authorization-server

volumes:
  postgres-data:

